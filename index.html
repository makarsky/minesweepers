<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="description" content="Classic Minesweeper puzzle game">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <meta name="theme-color" content="#1A237E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minesweeper">
  <title>Minesweeper</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="app-icons/favicon-32.png">
  <link rel="apple-touch-icon" href="app-icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css?family=Nunito:800" rel="stylesheet">
</head>

<body>
  <div class="container">
    <div class="app-container">
      <header class="side flex-item"></header>
      <main class="flex-item">
        <div class="square-container"></div>
      </main>
      <footer class="side flex-item">
        <div id="flag-counter" class="header-item label">010</div>
        <div class="header-item">
          <div id="restart-btn" class="square btn emoji" aria-label="Restart"></div>
        </div>
        <div class="header-item">
          <div id="enable-flag-btn" class="square btn flag-icon"></div>
        </div>
        <div id="stopwatch" class="header-item label">00:000</div>
      </footer>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (error) {
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>
</body>

</html>
